name: test
on:
  pull_request:
  push:
    branches:
      - main


jobs:
  test:
    name: build and test rosa
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v3.3.0
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y sudo gpg curl lsb-release software-properties-common python3-pip locales
          locale-gen en_US en_US.UTF-8
          update-locale LANG=en_US.UTF-8
          pip3 install -U pip setuptools wheel
      - name: install typedb
        run: .github/workflows/install_typedb.sh
      - name: run typedb
        run: typedb server&
      - uses: ros-tooling/setup-ros@0.7.1
        with:
          required-ros-distributions: humble
      - uses: ros-tooling/action-ros-ci@0.3.5
        with:
          package-name: rosa_msgs rosa_kb rosa_plan rosa_bringup
          import-token: ${{ secrets.GITHUB_TOKEN }}
          target-ros2-distro: humble
          vcs-repo-file-url: rosa.repos
